name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: 'read'

jobs:
  deploy:
    timeout-minutes: 10

    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Google Cloud Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ secrets.PROJECT_ID }}/locations/global/workloadIdentityPools/my-work/providers/my-work
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Deploy App Engine
        id: deploy
        uses: google-github-actions/deploy-appengine@v3
        env:
          CLOUDSDK_APP_CLOUD_BUILD_TIMEOUT: 180
